smallrye-config-core = { module = "io.smallrye.config:smallrye-config-core", version.ref = "smallrye-config" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
vertx-auth-oauth2 = { module = "io.vertx:vertx-auth-oauth2", version.ref = "vertx" }
vertx-grpcio-server = { module = "io.vertx:vertx-grpcio-server", version.ref = "vertx" }
