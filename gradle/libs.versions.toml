arrow = "2.2.2"
binary-resources = "32.3.1"
bucket4j = "8.17.0"
buf = "0.11.2"
bundletool = "1.18.3"
console-api = "21c87adcd1444aa1a849c9360766d6cb" # v0.10.0
detekt = "2.0.0-alpha.3"
google-cloud-libraries-bom = "26.86.0"
google-cloud-sql-postgres-socket-factory = "1.28.1"
htmlunit = "4.21.0"
jena-iri3986 = "6.1.0"
junit = "6.1.1"
kotlin = "2.4.10"
minio = "8.6.0"
protovalidate = "1.1.1"
quarkus = "3.32.3"

[libraries]
apkanalyzer = { module = "com.android.tools.apkparser:apkanalyzer", version.ref = "apkanalyzer" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
awaitility = { module = "org.awaitility:awaitility" }
binary-resources = { module = "com.android.tools.apkparser:binary-resources", version.ref = "binary-resources" }
bucket4j-postgresql = { module = "com.bucket4j:bucket4j_jdk17-postgresql", version.ref = "bucket4j" }
bundletool = { module = "com.android.tools.build:bundletool", version.ref = "bundletool" }
commons-compress = { module = "org.apache.commons:commons-compress" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
