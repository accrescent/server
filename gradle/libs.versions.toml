[versions]
agp = "9.4.1"
apksig = "9.4.1"
appstore-api = "1.5.0.4.20260925233938.cd9cbc3ac813"
arrow = "2.3.0"
binary-resources = "32.5.0"
bundletool = "1.18.3"
cloud-sql-connector = "1.30.2"
compress = "1.28.0"
console-api = "1.5.0.4.20261028030221.7d8655b25148"
detekt = "2.0.0-alpha.6"
flyway = "13.11.1"
google-cloud = "26.90.0"
h2 = "2.5.252"
jboss-logmanager = "3.2.2.Final"
jena-iri3986 = "6.2.0"
junit = "6.1.3"
kotlin = "2.4.21"
postgresql = "42.7.14"
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
