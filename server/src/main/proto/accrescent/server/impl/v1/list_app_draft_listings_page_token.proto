syntax = "proto3";

package accrescent.server.impl.v1;

option java_multiple_files = true;
option java_package = "app.accrescent.server.impl.v1";

// A "next page" token returned in ListAppDraftListingsResponse.
message ListAppDraftListingsPageToken {
  // The BCP-47 code of the last app draft listing language returned in the
  // ListAppDraftListingsResponse. Required.
  optional string last_language = 1;
}
